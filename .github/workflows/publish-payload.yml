name: Publish signed Omarchy installer payload
on:
  workflow_dispatch:
    inputs:
      image-run:
        description: Successful image workflow run with complete VM qualification
        required: true
  workflow_run:
    workflows: [Omarchy Aurora images]
    types: [completed]
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
jobs:
  qualification:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Require real first-boot package trust
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_RUN: ${{ inputs.image-run || format('{0}', github.event.workflow_run.id) }}
        run: |
          set -euo pipefail
          [[ $IMAGE_RUN =~ ^[0-9]+$ ]]
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IMAGE_RUN/artifacts" \
            --jq '.artifacts[] | select(.name == "omarchy-hyprland-candidate" and .expired == false) | .id')
          [[ $artifact =~ ^[0-9]+$ ]]
          python3 scripts/artifact-entry.py --artifact "$artifact" --entry out/vm-result.json \
            --output "$RUNNER_TEMP/package-trust-vm.json"
          python3 - "$RUNNER_TEMP/package-trust-vm.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1]))
          assert result.get('package_trust') is True, 'VM did not prove first-boot package trust'
          PY
  delivery:
    needs: qualification
    uses: aurora-silicon/aurora-distributions/.github/workflows/build-payload.yml@d52ce8bec99ebe70483fb4a3fd304a3158a7ddbb
    with:
      profile: omarchy-hyprland
      image-run: ${{ inputs.image-run || format('{0}', github.event.workflow_run.id) }}
    secrets:
      INSTALLER_CATALOG_SIGNING_KEY: ${{ secrets.INSTALLER_CATALOG_SIGNING_KEY }}
