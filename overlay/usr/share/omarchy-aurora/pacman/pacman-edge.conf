[options]
HoldPkg = pacman glibc
Architecture = auto
Color
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[aurora]
SigLevel = Required DatabaseRequired
Server = https://aurorasilicon.org/alarm-aurora/testing/aarch64

[omarchy-aurora]
SigLevel = Required DatabaseRequired
Server = https://aurorasilicon.org/omarchy-aurora/testing/aarch64

[omarchy]
SigLevel = Required DatabaseOptional
Server = https://pkgs.omarchy.org/edge/aarch64

[asahi-alarm]
Server = https://github.com/asahi-alarm/asahi-alarm/releases/download/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist
